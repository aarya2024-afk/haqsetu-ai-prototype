<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HaqSetu AI — Entitlement Audit &amp; Recovery Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --teal-dark:#063F3C;
  --teal-deep:#0B514D;
  --offwhite:#F7F4EC;
  --white:#FFFFFF;
  --terracotta:#D98262;
  --terracotta-dark:#C06B4C;
  --gold:#C7A56A;
  --charcoal:#232323;
  --grey:#77736D;
  --amber:#B8863A;
  --amber-bg:#F5EBDA;
  --brick:#9C4A38;
  --brick-bg:#F3E4DF;
  --green:#3F6B4F;
  --green-bg:#E7EEE6;
  --border:#DCD6C6;
  --border-dark:rgba(247,244,236,0.18);
  --radius:4px;
  --serif:'Playfair Display', Georgia, serif;
  --sans:'Inter','Source Sans 3',-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--charcoal);
  background:var(--offwhite);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.eyebrow{
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:600;
  margin:0 0 10px;
}
.eyebrow.on-dark{color:var(--gold);}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;color:var(--charcoal);letter-spacing:-0.01em;}
.serif-italic{font-style:italic;font-weight:500;}
p{margin:0;}
.container{max-width:1180px;margin:0 auto;padding:0 32px;}
@media(max-width:640px){.container{padding:0 20px;}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--radius);
  padding:13px 24px;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.05em;
  text-transform:uppercase;
  border:1px solid transparent;
  transition:all .15s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--terracotta);color:#fff;}
.btn-primary:hover{background:var(--terracotta-dark);}
.btn-outline{background:transparent;border-color:var(--teal-dark);color:var(--teal-dark);}
.btn-outline:hover{background:var(--teal-dark);color:#fff;}
.btn-outline-light{background:transparent;border-color:rgba(247,244,236,0.5);color:var(--offwhite);}
.btn-outline-light:hover{background:rgba(247,244,236,0.12);border-color:var(--offwhite);}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--charcoal);}
.btn-ghost:hover{border-color:var(--teal-dark);}
.btn-sm{padding:9px 16px;font-size:11.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

/* ============ NAV ============ */
.topnav{
  position:sticky;top:0;z-index:50;
  background:rgba(247,244,236,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topnav-inner{
  max-width:1180px;margin:0 auto;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;
  height:72px;
}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;font-weight:700;color:var(--teal-dark);cursor:pointer;}
.logo-mark{width:26px;height:26px;flex:none;}
.nav-links{display:flex;gap:34px;align-items:center;}
.nav-links a{font-size:13.5px;font-weight:500;color:var(--charcoal);cursor:pointer;padding:4px 0;border-bottom:2px solid transparent;}
.nav-links a:hover,.nav-links a.active{border-bottom-color:var(--terracotta);}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-login{font-size:13.5px;font-weight:500;cursor:pointer;color:var(--teal-dark);}
@media(max-width:900px){.nav-links{display:none;}}

/* ============ HERO ============ */
.hero{
  position:relative;
  background:
    linear-gradient(100deg, rgba(6,63,60,0.86) 0%, rgba(6,63,60,0.55) 45%, rgba(6,63,60,0.25) 100%),
    url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1800&auto=format&fit=crop') center/cover no-repeat;
  color:var(--offwhite);
  padding:120px 0 96px;
}
.hero-inner{max-width:640px;}
.hero h1{font-size:46px;line-height:1.12;color:#fff;margin-bottom:22px;}
.hero p.lead{font-size:17px;line-height:1.6;color:rgba(247,244,236,0.88);max-width:520px;margin-bottom:34px;}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
.hero-trust{font-size:12.5px;color:rgba(247,244,236,0.65);letter-spacing:0.03em;border-top:1px solid rgba(247,244,236,0.25);padding-top:16px;max-width:420px;}
@media(max-width:640px){.hero{padding:80px 0 64px;}.hero h1{font-size:32px;}}

/* ============ FEATURE CARDS ============ */
.section{padding:88px 0;}
.section-tight{padding:64px 0;}
.section-head{max-width:600px;margin-bottom:48px;}
.section-head h2{font-size:32px;line-height:1.2;}
.section-head p{margin-top:14px;color:var(--grey);font-size:15.5px;line-height:1.65;}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media(max-width:900px){.feature-grid{grid-template-columns:1fr;}}
.feature-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;
}
.feature-photo{height:150px;background-size:cover;background-position:center;position:relative;}
.feature-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,63,60,0.15),rgba(6,63,60,0.55));}
.feature-body{padding:26px 24px 30px;}
.feature-tag{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--terracotta);margin-bottom:10px;}
.feature-body h3{font-size:19px;margin-bottom:10px;}
.feature-body p{color:var(--grey);font-size:14.5px;line-height:1.6;}

/* ============ DARK TEAL SECTION ============ */
.dark-section{background:var(--teal-dark);color:var(--offwhite);padding:96px 0;}
.dark-section .section-head h2{color:#fff;max-width:640px;}
.dark-section .section-head p{color:rgba(247,244,236,0.72);max-width:600px;}
.numbered-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(247,244,236,0.16);margin-top:48px;border:1px solid rgba(247,244,236,0.16);}
.numbered-card{background:var(--teal-dark);padding:30px 26px;}
.numbered-card .num{font-family:var(--serif);font-size:26px;color:var(--gold);margin-bottom:16px;}
.numbered-card h4{font-family:var(--sans);font-weight:600;font-size:15px;color:#fff;margin:0;}
.numbered-card .icon{width:30px;height:30px;margin-bottom:16px;opacity:0.85;}
@media(max-width:900px){.numbered-grid{grid-template-columns:repeat(2,1fr);}}

/* ============ FOOTER ============ */
footer{background:var(--teal-dark);color:rgba(247,244,236,0.75);padding:64px 0 28px;border-top:1px solid rgba(247,244,236,0.12);}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px;margin-bottom:48px;}
.footer-grid h5{font-family:var(--serif);color:#fff;font-size:19px;margin-bottom:12px;}
.footer-grid .col-title{font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;font-weight:600;}
.footer-grid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px;}
.footer-bottom{border-top:1px solid rgba(247,244,236,0.15);padding-top:22px;font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:rgba(247,244,236,0.55);}
@media(max-width:800px){.footer-grid{grid-template-columns:1fr 1fr;}}

/* ============ APP SHELL (post-nav pages) ============ */
.app-shell{background:var(--offwhite);min-height:60vh;}
.page-header{padding:44px 0 8px;}
.page-header .eyebrow{margin-bottom:8px;}
.page-header h1{font-size:30px;}
.page-header .sub{color:var(--grey);font-size:15px;margin-top:8px;max-width:640px;}
.back-link{font-size:13px;color:var(--teal-deep);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;}
.back-link:hover{text-decoration:underline;}

/* progress stepper */
.stepper{display:flex;align-items:center;gap:0;margin:36px 0 8px;}
.step{display:flex;align-items:center;gap:10px;color:var(--grey);font-size:12.5px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;}
.step .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:12px;background:#fff;color:var(--grey);}
.step.active .dot{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff;}
.step.done .dot{background:var(--green);border-color:var(--green);color:#fff;}
.step.active,.step.done{color:var(--charcoal);}
.step-line{flex:1;height:1px;background:var(--border);margin:0 14px;min-width:24px;}

/* cards general */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);}
.pad-lg{padding:34px;}
.pad-md{padding:24px;}
@media(max-width:640px){.pad-lg{padding:22px;}}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--charcoal);margin-bottom:7px;}
.field input,.field select{
  width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:var(--radius);
  font-family:inherit;font-size:14.5px;background:#fff;color:var(--charcoal);
}
.field input:focus,.field select:focus{outline:2px solid var(--teal-deep);outline-offset:1px;}
.field-note{font-size:12px;color:var(--grey);margin-top:6px;}

.demo-banner{
  border:1px dashed var(--gold);background:var(--amber-bg);border-radius:var(--radius);
  padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;
}
.demo-banner .txt{font-size:13.5px;color:var(--charcoal);}
.demo-banner .txt strong{display:block;font-size:14.5px;margin-bottom:2px;}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:5px 10px;border-radius:3px;}
.pill-warn{background:var(--amber-bg);color:var(--amber);}
.pill-error{background:var(--brick-bg);color:var(--brick);}
.pill-ok{background:var(--green-bg);color:var(--green);}
.pill-muted{background:#EFEBDD;color:var(--grey);}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* document rows */
.doc-row{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:14px;flex-wrap:wrap;
}
.doc-left{display:flex;gap:16px;align-items:flex-start;}
.doc-icon{width:38px;height:38px;flex:none;border-radius:var(--radius);background:var(--offwhite);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.doc-icon svg{width:18px;height:18px;stroke:var(--teal-dark);}
.doc-name{font-weight:600;font-size:15px;margin-bottom:5px;}
.doc-meta{font-size:12.5px;color:var(--grey);line-height:1.6;}
.doc-meta .issue{color:var(--brick);}

/* processing */
.proc-wrap{max-width:560px;margin:0 auto;text-align:center;padding:100px 0;}
.proc-wrap h2{font-size:24px;margin-bottom:8px;}
.proc-wrap .sub{color:var(--grey);font-size:14px;margin-bottom:40px;}
.proc-list{text-align:left;display:inline-block;}
.proc-item{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14.5px;color:var(--border);opacity:0.4;transition:all .3s ease;}
.proc-item.active{opacity:1;color:var(--charcoal);}
.proc-item.done{opacity:1;color:var(--grey);}
.proc-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;}
.proc-item.active .proc-check{border-color:var(--teal-dark);}
.proc-item.active .proc-check .spin{width:9px;height:9px;border-radius:50%;border:2px solid var(--teal-dark);border-top-color:transparent;animation:spin 0.8s linear infinite;}
.proc-item.done .proc-check{background:var(--green);border-color:var(--green);}
.proc-item.done .proc-check svg{width:11px;height:11px;stroke:#fff;}
@keyframes spin{to{transform:rotate(360deg);}}
.proc-bar-track{height:3px;background:var(--border);border-radius:2px;margin:32px 0 0;overflow:hidden;}
.proc-bar-fill{height:100%;background:var(--terracotta);width:0%;transition:width .4s ease;}

/* results summary */
.result-hero{display:grid;grid-template-columns:1.1fr 0.9fr;gap:28px;margin-bottom:16px;}
@media(max-width:800px){.result-hero{grid-template-columns:1fr;}}
.gap-number{font-family:var(--serif);font-size:52px;color:var(--teal-dark);line-height:1;}
.gap-label{font-size:13px;color:var(--grey);margin-top:8px;}
.stat-row{display:flex;gap:0;border-top:1px solid var(--border);margin-top:22px;}
.stat-cell{flex:1;padding:16px 0 0;border-right:1px solid var(--border);}
.stat-cell:last-child{border-right:none;}
.stat-cell .n{font-family:var(--serif);font-size:26px;color:var(--charcoal);}
.stat-cell .l{font-size:11.5px;color:var(--grey);text-transform:uppercase;letter-spacing:0.05em;margin-top:4px;}

/* benefit cards */
.benefit-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;}
@media(max-width:760px){.benefit-grid{grid-template-columns:1fr;}}
.benefit-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;cursor:pointer;transition:border-color .15s ease, box-shadow .15s ease;}
.benefit-card:hover{border-color:var(--teal-deep);box-shadow:0 2px 10px rgba(6,63,60,0.06);}
.benefit-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
.benefit-card h3{font-size:18px;margin-bottom:6px;}
.benefit-elig{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:0.03em;}
.benefit-amount{font-family:var(--serif);font-size:22px;color:var(--teal-dark);margin:10px 0 12px;}
.benefit-reason{font-size:13px;color:var(--grey);margin-bottom:16px;line-height:1.5;}
.benefit-reason strong{color:var(--charcoal);}

/* section rhythm labels */
.subhead{font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--grey);margin:36px 0 16px;display:flex;align-items:center;gap:10px;}
.subhead::after{content:'';flex:1;height:1px;background:var(--border);}

/* detail page */
.detail-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:start;}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr;}}
.check-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
.check-list li{display:flex;align-items:center;gap:10px;font-size:14.5px;}
.check-list svg{width:16px;height:16px;stroke:var(--green);flex:none;}
.blocker-box{border-left:3px solid var(--brick);background:var(--brick-bg);border-radius:var(--radius);padding:22px 24px;margin-top:22px;}
.blocker-box h4{font-size:16px;margin-bottom:8px;color:var(--brick);font-family:var(--sans);font-weight:700;}
.blocker-box p{font-size:14px;line-height:1.65;color:var(--charcoal);}
.blocker-box p.quote{font-style:italic;margin-top:10px;color:#5C332A;}
.todo-list{list-style:none;margin:14px 0 0;padding:0;counter-reset:todo;}
.todo-list li{counter-increment:todo;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px;}
.todo-list li:last-child{border-bottom:none;}
.todo-list li::before{content:counter(todo);font-family:var(--serif);font-size:14px;color:var(--gold);width:20px;flex:none;}

/* cross check */
.crosscheck{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-top:18px;}
.cc-box{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:var(--offwhite);}
.cc-box .lbl{font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.cc-box .val{font-size:16px;font-weight:600;}
.cc-vs{font-family:var(--serif);font-style:italic;color:var(--grey);font-size:13px;}
@media(max-width:600px){.crosscheck{grid-template-columns:1fr;}.cc-vs{justify-self:center;}}

/* ask haqsetu */
.ask-widget{border:1px solid var(--border);border-radius:var(--radius);background:#fff;}
.ask-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.ask-header .dotmark{width:8px;height:8px;border-radius:50%;background:var(--terracotta);}
.ask-header h4{font-family:var(--sans);font-weight:700;font-size:14px;}
.ask-body{padding:18px 20px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.ask-msg{font-size:13.5px;line-height:1.55;max-width:92%;padding:11px 14px;border-radius:var(--radius);}
.ask-msg.user{align-self:flex-end;background:var(--teal-dark);color:#fff;}
.ask-msg.bot{align-self:flex-start;background:var(--offwhite);border:1px solid var(--border);}
.ask-suggestions{padding:0 20px 18px;display:flex;flex-direction:column;gap:8px;}
.ask-suggest-btn{
  text-align:left;font-size:12.5px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);
  background:#fff;color:var(--teal-deep);font-weight:500;
}
.ask-suggest-btn:hover{border-color:var(--teal-deep);}

/* recovery timeline */
.rec-timeline{display:flex;flex-direction:column;}
.rec-item{display:flex;gap:22px;position:relative;padding-bottom:36px;}
.rec-item:last-child{padding-bottom:0;}
.rec-line{position:absolute;left:19px;top:40px;bottom:0;width:1px;background:var(--border);}
.rec-item:last-child .rec-line{display:none;}
.rec-num{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;background:#fff;border:1.5px solid var(--teal-dark);color:var(--teal-dark);z-index:1;}
.rec-num.complete{background:var(--green);border-color:var(--green);color:#fff;}
.rec-content{flex:1;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;}
.rec-content.complete{opacity:0.65;}
.rec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.rec-title{font-size:16.5px;font-weight:700;}
.rec-meta{display:flex;gap:18px;font-size:12.5px;color:var(--grey);margin:8px 0 16px;flex-wrap:wrap;}
.priority-high{color:var(--brick);font-weight:700;}
.priority-med{color:var(--amber);font-weight:700;}

/* tracker */
.tracker-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;margin-bottom:18px;}
.tracker-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.tracker-stages{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:9px;}
.tracker-stages li{font-size:14px;display:flex;align-items:center;gap:10px;color:var(--grey);}
.tracker-stages li.done{color:var(--charcoal);}
.tracker-stages li.done svg{stroke:var(--green);}
.tracker-stages svg{width:15px;height:15px;stroke:var(--border);flex:none;}
.progress-track{height:6px;background:var(--offwhite);border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--terracotta);transition:width .4s ease;}
.progress-pct{font-size:12px;color:var(--grey);margin-top:6px;}

/* rejection analyzer */
.upload-box{border:1.5px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;background:#fff;margin-bottom:26px;}
.upload-box .fname{display:inline-flex;align-items:center;gap:10px;background:var(--offwhite);border:1px solid var(--border);border-radius:var(--radius);padding:9px 16px;font-size:13.5px;font-weight:600;margin-top:14px;}
.compare-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
@media(max-width:700px){.compare-col{grid-template-columns:1fr;}}
.compare-box{border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
.compare-box.official{background:var(--offwhite);}
.compare-box.explain{background:var(--green-bg);border-color:#C7D6C9;}

.compare-box.explain h5{color:var(--green);}
.compare-box p{font-size:14.5px;line-height:1.6;}

.next-step-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding:18px 20px;background:var(--teal-dark);color:#fff;border-radius:var(--radius);font-size:13.5px;font-weight:600;}
.next-step-strip .arrow{color:var(--gold);}

/* dashboard */
.dash-greeting{font-size:28px;margin-bottom:6px;}
.dash-stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap;}
.dash-stat{display:flex;flex-direction:column;}
.dash-stat .n{font-family:var(--serif);font-size:24px;color:var(--teal-dark);}
.dash-stat .l{font-size:12px;color:var(--grey);}
.activity-row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.activity-row:last-child{border-bottom:none;}
.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:6px;flex:none;}
.activity-time{color:var(--grey);font-size:12px;min-width:70px;}

/* dataset note */
.dataset-note{
  border:1px solid var(--gold);border-radius:var(--radius);background:#FBF7EE;
  padding:16px 20px;font-size:13px;color:var(--charcoal);margin:28px 0;
}
.dataset-note strong{display:block;font-size:13.5px;margin-bottom:3px;color:var(--charcoal);}
.dataset-table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13.5px;}
.dataset-table th{text-align:left;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--grey);padding:10px 12px;border-bottom:1px solid var(--border);}
.dataset-table td{padding:12px;border-bottom:1px solid var(--border);}

.two-col{display:grid;grid-template-columns:2fr 1fr;gap:32px;align-items:start;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.sticky{position:sticky;top:96px;}

/* disclaimer bar */
.disclaimer-bar{background:var(--teal-deep);color:rgba(247,244,236,0.85);font-size:12.5px;text-align:center;padding:9px 20px;}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--teal-dark);color:#fff;padding:13px 22px;border-radius:var(--radius);font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s ease;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.2);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.hidden{display:none !important;}
.grid-cols-4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--border);border-top:none;}

function computeGap(){
  return BENEFITS.filter(b=>b.status!=='ACTIVE').reduce((sum,b)=>sum+b.amount,0);

function computeCounts(){
  return {
    eligible: BENEFITS.length,
    receiving: BENEFITS.filter(b=>b.status==='ACTIVE').length,

/* ============================================================
   ROUTER
   ============================================================ */
function go(page, opts){
  STATE.currentPage = page;
  render();
  window.scrollTo({top:0, behavior:'instant'});
  if(opts && opts.scroll){
    setTimeout(()=>{
      const el = document.getElementById(opts.scroll);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    },80);
  }
  document.querySelectorAll('.nav-links a').forEach(a=>a.classList.toggle('active', a.dataset.page===page));
}
function openBenefit(id){
  STATE.currentBenefit = id;
  go('benefit');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function loadDemo(){
  STATE.onboarded = true;
  STATE.documentsLoaded = true;
  showToast('Demo profile loaded — Aarav Sharma');
  go('documents');
}
function fmt(n){ return '₹' + n.toLocaleString('en-IN'); }

/* ============================================================
   RENDER — PAGES
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  const p = STATE.currentPage;
  let html = '';
  if(p==='home') html = pageHome();
  else if(p==='start') html = pageStart();
  else if(p==='documents') html = pageDocuments();
  else if(p==='processing') html = pageProcessing();
  else if(p==='results') html = pageResults();
  else if(p==='benefit') html = pageBenefit();
  else if(p==='recovery') html = pageRecovery();
  else if(p==='tracker') html = pageTracker();
  else if(p==='rejection') html = pageRejection();
  else if(p==='dashboard') html = pageDashboard();
  else html = pageHome();

  html += pageFooter();
  app.innerHTML = html;

  if(p==='processing') runProcessing();
  if(p==='benefit') wireAsk();
}

/* ---------- PROCESSING ---------- */
function pageProcessing(){
  return `
  <div class="app-shell">
    <div class="container">
      <div class="proc-wrap">
        <div class="eyebrow" style="text-align:center;">Entitlement Audit</div>
        <h2>Auditing Your Entitlements</h2>
        <div class="sub">This usually takes a few moments.</div>
        <div class="proc-list" id="procList">
          <div class="proc-item" data-i="0"><div class="proc-check"></div>Building citizen profile</div>
          <div class="proc-item" data-i="1"><div class="proc-check"></div>Checking eligibility rules</div>
          <div class="proc-item" data-i="2"><div class="proc-check"></div>Comparing current benefits</div>
          <div class="proc-item" data-i="3"><div class="proc-check"></div>Reviewing submitted documents</div>
          <div class="proc-item" data-i="4"><div class="proc-check"></div>Detecting potential blockers</div>
          <div class="proc-item" data-i="5"><div class="proc-check"></div>Preparing recovery actions</div>
        </div>
        <div class="proc-bar-track"><div class="proc-bar-fill" id="procBar"></div></div>
      </div>
    </div>
  </div>`;
}
function runProcessing(){
  const items = document.querySelectorAll('.proc-item');
  const bar = document.getElementById('procBar');
  let i = 0;
  function step(){
    if(i>0) items[i-1].classList.replace('active','done');
    items[i-1] && (items[i-1].querySelector('.proc-check').innerHTML = ICONS.check);
    if(i < items.length){
      items[i].classList.add('active');
      items[i].querySelector('.proc-check').innerHTML = '<div class="spin"></div>';
      bar.style.width = Math.round(((i+1)/items.length)*100) + '%';
      i++;
      setTimeout(step, 480);
    } else {
      STATE.auditRun = true;
      setTimeout(()=>go('results'), 400);
    }
  }
  setTimeout(step, 300);
}

function benefitCard(b){
  const statusPill = b.status==='ACTIVE' ? `<span class="pill pill-ok"><span class="pill-dot"></span>Active</span>`
    : b.status==='BLOCKED' ? `<span class="pill pill-error"><span class="pill-dot"></span>Blocked</span>`
    : b.status==='ACTION REQUIRED' ? `<span class="pill pill-warn"><span class="pill-dot"></span>Action Required</span>`
    : `<span class="pill pill-muted"><span class="pill-dot"></span>Not Applied</span>`;
  const cta = b.status==='ACTIVE' ? 'View Benefit'
    : b.status==='BLOCKED' ? 'View Recovery Path'
    : b.status==='ACTION REQUIRED' ? 'Fix Issue'
    : 'Start Application';
  return `
  <div class="benefit-card" onclick="openBenefit('${b.id}')">
    <div class="benefit-top">
      <div>
        <div class="benefit-elig">${b.eligible?'Likely Eligible':'Not Eligible'}</div>
        <h3>${b.name}</h3>
      </div>
      ${statusPill}
    </div>
    <div class="benefit-amount">${fmt(b.amount)} <span style="font-family:var(--sans);font-size:13px;color:var(--grey);font-weight:400;">/ year</span></div>
    ${b.status!=='ACTIVE' ? `<div class="benefit-reason">Reason: <strong>${b.reason}</strong></div>` : `<div class="benefit-reason">Currently disbursed to your account.</div>`}
    <button class="btn ${b.status==='ACTIVE'?'btn-ghost':'btn-primary'} btn-sm">${cta}</button>
  </div>`;
}
